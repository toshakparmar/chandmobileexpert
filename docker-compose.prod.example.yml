services:
  postgres:
    image: postgres:16-alpine
    container_name: chand_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chand_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - prod_redis_data:/data

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    container_name: chand_prod_api
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 3000
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    container_name: chand_prod_web
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: https://api.chandmobileexpert.com
      PORT: 3001
    ports:
      - "3001:3001"

  admin:
    build:
      context: .
      dockerfile: infra/Dockerfile.admin
    container_name: chand_prod_admin
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: https://api.chandmobileexpert.com
      PORT: 3002
    ports:
      - "3002:3002"

volumes:
  prod_postgres_data:
  prod_redis_data:

